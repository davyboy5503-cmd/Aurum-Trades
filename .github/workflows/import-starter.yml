
name: Import AurumTrade Starter

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract starter project
        run: |
          unzip -o AurumTrade-android-starter.zip
          cp -R AurumTrade/. .
          rm -rf AurumTrade
          rm -f AurumTrade-android-starter.zip
          rm -f .github/workflows/android.yml

      - name: Commit project files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Import AurumTrade starter project"
          git push

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Android APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AurumTrade-debug-APK
          path: app/build/outputs/apk/debug/*.apk
          
